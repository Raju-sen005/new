version: "3.8"

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"  # This is still fine for external access
    environment:
      MYSQL_ROOT_PASSWORD: root # TODO: Need to put this into env file
      MYSQL_DATABASE: mydb
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      - app-network

  # 2. Node.js Server Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: node_server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: my_project_db
    ports:
      - "3000:3000"
    depends_on:
      - db

  # 3. Frontend React App Service (served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    restart: always
    ports:
      - "8080:80" # http://localhost:8080
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server

  # 4. Admin React App Service (served by Nginx)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin_app
    restart: always
    ports:
      - "8081:80" # http://localhost:8081
    volumes:
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server

volumes:
  db_data:
    driver: local
