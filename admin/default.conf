server {
    listen 80;
    server_name localhost;

    # Set root to the directory where the React build output is copied
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Handle all API requests and forward them to the 'server' service
    # The 'server' hostname is automatically resolved by Docker Compose.
    location /api {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prevent Nginx from caching index.html, important for updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Error logging
    error_log /var/log/nginx/admin_error.log warn;
    access_log /var/log/nginx/admin_access.log;
}